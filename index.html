<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edju Cat</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, Arial;
  }

  html, body {
    height: 100%;
  }

  .hero {
    height: 100vh;
    background: url("background.jpg") center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* LOGO */
  .logo {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(160px, 20vw, 260px);
    z-index: 3;
  }

  /* CONTACT SECTION */
  .contact {
    padding: 60px 20px;
    background: #f5f5f5;
    text-align: center;
  }

  .contact h2 {
    margin-bottom: 10px;
    font-size: 28px;
  }

  form {
    max-width: 420px;
    margin: 20px auto 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  input, select, textarea {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
  }

  button {
    padding: 14px;
    background: black;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
</style>
</head>

<body>

<section class="hero">

  <!-- Logo -->
  <img src="logo-with-tag.png" class="logo" alt="Edju Cat Logo">

</section>

<section id="contact" class="contact">
  <h2>Get in Touch</h2>

  <form>
    <input type="text" placeholder="Name" required>
    <input type="email" placeholder="Email" required>

    <select>
      <option>I'm a Parent</option>
      <option>I'm a Teacher</option>
      <option>Investor</option>
      <option>Other</option>
    </select>

    <textarea placeholder="Message (optional)"></textarea>

    <button type="submit">Send</button>
  </form>
</section>

</body>
</html>
