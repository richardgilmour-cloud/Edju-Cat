<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edju Cat</title>

<!-- Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, Arial, sans-serif;
  }

  body {
    background: #001827;
  }

  .page {
    min-height: 150vh;
    background: url("background.jpg") top center / cover no-repeat;
    position: relative;
  }

  .logo {
    position: absolute;
    top: 6vh;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(190px, 24vw, 360px);
  }

  /* LOWER + MORE COMPACT */
  .contact-wrap {
    position: absolute;
    left: 50%;
    bottom: 5vh; /* pushed further down */
    transform: translateX(-50%);
    width: min(92%, 700px); /* slightly smaller */
  }

  .contact-card {
    background: rgba(2, 18, 32, 0.5); /* reduced opacity */
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(12px);
    border-radius: 22px;
    padding: 22px 22px 20px; /* tighter */
    color: white;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
  }

  .contact-card h2 {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: clamp(24px, 3.5vw, 34px);
    margin-bottom: 8px;
    text-align: center;
  }

  .contact-card p {
    max-width: 580px;
    margin: 0 auto 18px;
    text-align: center;
    font-size: 14px;
    line-height: 1.4;
    opacity: 0.9;
  }

  form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  input, select, textarea {
    border: none;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    background: rgba(255,255,255,0.9);
    color: #07121f;
  }

  textarea {
    grid-column: 1 / -1;
    min-height: 70px; /* reduced height */
  }

  .full {
    grid-column: 1 / -1;
  }

  button {
    grid-column: 1 / -1;
    justify-self: center;
    margin-top: 4px;
    padding: 12px 28px;
    background: #22d3ee;
    color: #001827;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 8px 25px rgba(34, 211, 238, 0.35);
  }

  @media (max-width: 700px) {
    .page {
      min-height: 155vh;
    }

    .contact-wrap {
      bottom: 4vh;
    }

    form {
      grid-template-columns: 1fr;
    }

    textarea, .full, button {
      grid-column: auto;
    }
  }
</style>
</head>

<body>

<main class="page">

  <img src="logo-with-tag.png" class="logo" alt="Edju Cat">

  <section class="contact-wrap">
    <div class="contact-card">
      <h2>Help Shape Edju Cat</h2>

      <p>
        We’re building a new kind of learning platform powered by a library of immersive, story-driven adventures.</p>

      <form>
        <input type="text" placeholder="Name" required>
        <input type="email" placeholder="Email" required>

        <select class="full" required>
          <option value="">I’m interested as...</option>
          <option>Parent</option>
          <option>Teacher / School</option>
          <option>Investor</option>
          <option>Creative / Developer / Educator</option>
          <option>Partnership</option>
          <option>Other</option>
        </select>

        <textarea placeholder="Short message (optional)"></textarea>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </section>

</main>

</body>
</html>
