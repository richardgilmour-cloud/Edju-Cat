<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edju Cat</title>

<!-- Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #001827;
    font-family: system-ui, -apple-system, Arial, sans-serif;
    overflow-x: hidden;
  }

  .page {
    min-height: 150vh;
    background: url("background.jpg") top center / cover no-repeat;
    position: relative;
  }

  /* =========================
     HERO LOGO AREA
  ========================== */

  .hero-logo {
    position: absolute;
    top: 5vh;
    left: 50%;
    transform: translateX(-50%);
    width: min(90%, 760px);
    text-align: center;
  }

  .logo-mark {
    display: block;
    width: clamp(320px, 52vw, 720px);
    margin: 0 auto 24px;
  }

  .tag-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    width: min(92vw, 700px);

    padding: 20px 38px;

    background: #40efe6;

    border-radius: 999px;

    color: #03195f;

    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: clamp(18px, 2.2vw, 32px);
    letter-spacing: 0.06em;
    line-height: 1;
    text-align: center;

    box-shadow:
      0 12px 30px rgba(0,0,0,0.18),
      inset 0 1px 0 rgba(255,255,255,0.25);
  }

  /* =========================
     CONTACT CARD
  ========================== */

  .contact-wrap {
    position: absolute;
    left: 50%;
    bottom: 5vh;
    transform: translateX(-50%);
    width: min(92%, 700px);
  }

  .contact-card {
    background: rgba(2, 18, 32, 0.42);
    border: 1px solid rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(10px);

    border-radius: 24px;

    padding: 22px 22px 20px;

    color: white;

    box-shadow:
      0 18px 50px rgba(0, 0, 0, 0.35);
  }

  .contact-card h2 {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;

    font-size: clamp(24px, 3.5vw, 34px);

    margin-bottom: 8px;

    text-align: center;
  }

  .contact-card p {
    max-width: 580px;

    margin: 0 auto 18px;

    text-align: center;

    font-size: 14px;
    line-height: 1.45;

    opacity: 0.92;
  }

  /* =========================
     FORM
  ========================== */

  form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  input,
  select,
  textarea {
    border: none;

    border-radius: 12px;

    padding: 12px 14px;

    font-size: 14px;

    background: rgba(255,255,255,0.92);

    color: #07121f;

    width: 100%;
  }

  textarea {
    grid-column: 1 / -1;

    min-height: 70px;

    resize: vertical;
  }

  .full {
    grid-column: 1 / -1;
  }

  button {
    grid-column: 1 / -1;

    justify-self: center;

    margin-top: 4px;

    padding: 12px 28px;

    background: #40efe6;

    color: #04165b;

    border: none;

    border-radius: 999px;

    cursor: pointer;

    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 14px;

    transition:
      transform 0.2s ease,
      opacity 0.2s ease;
  }

  button:hover {
    transform: translateY(-1px);
    opacity: 0.95;
  }

  /* =========================
     MOBILE
  ========================== */

  @media (max-width: 700px) {

    .page {
      min-height: 160vh;
    }

    .hero-logo {
      top: 4vh;
      width: 94%;
    }

    .logo-mark {
      width: min(92vw, 560px);
      margin-bottom: 18px;
    }

    .tag-pill {
      padding: 16px 22px;
      font-size: clamp(15px, 4vw, 22px);
      letter-spacing: 0.04em;
    }

    .contact-wrap {
      bottom: 4vh;
    }

    form {
      grid-template-columns: 1fr;
    }

    textarea,
    .full,
    button {
      grid-column: auto;
    }
  }

</style>
</head>

<body>

<main class="page">

  <!-- =========================
       LOGO + TAGLINE
  ========================== -->

  <div class="hero-logo">

    <img
      src="edju-cat-type-logo-svg.svg"
      class="logo-mark"
      alt="Edju Cat"
    >

    <div class="tag-pill">
      WHAT WILL YOU LEARN TODAY?
    </div>

  </div>

  <!-- =========================
       CONTACT SECTION
  ========================== -->

  <section class="contact-wrap">

    <div class="contact-card">

      <h2>Help Shape Edju Cat</h2>

      <p>
        We’re building a new kind of learning platform powered by a library of immersive, story-driven adventures.
      </p>

      <form action="https://formsubmit.co/richard@edjucat.com" method="POST">

        <!-- Send copy to Steven -->
        <input type="hidden" name="_cc" value="steven@edjucat.com">

        <!-- Disable captcha -->
        <input type="hidden" name="_captcha" value="false">

        <!-- Email subject -->
        <input type="hidden" name="_subject" value="New Edju Cat Enquiry">

        <!-- Optional redirect after submit -->
        <!--
        <input type="hidden" name="_next" value="https://edjucat.com/thanks.html">
        -->

        <input
          type="text"
          name="name"
          placeholder="Name"
          required
        >

        <input
          type="email"
          name="email"
          placeholder="Email"
          required
        >

        <select
          class="full"
          name="interest"
          required
        >
          <option value="">I’m interested as...</option>
          <option>Investor</option>
          <option>Parent</option>
          <option>Teacher / School</option>
          <option>Developer / Content Creator</option>
          <option>Partnership</option>
          <option>Other</option>
        </select>

        <textarea
          name="message"
          placeholder="Short message (optional)"
        ></textarea>

        <button type="submit">
          Send Message
        </button>

      </form>

    </div>

  </section>

</main>

</body>
</html>
