<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edju Cat</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, Arial;
  }

  html, body {
    height: 100%;
  }

  .hero {
    height: 100vh;
    background: url("background.jpg") center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    position: relative;
  }

  /* LOGO */
  .logo {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(160px, 20vw, 260px);
    z-index: 3;
  }

  /* MAIN CONTENT */
  .content {
    z-index: 2;
  }

  h1 {
    font-size: clamp(36px, 6vw, 56px);
    letter-spacing: 3px;
  }

  p {
    margin-top: 12px;
    font-size: clamp(18px, 2.5vw, 22px);
  }

  .cta {
    margin-top: 30px;
    padding: 14px 28px;
    background: #22d3ee;
    color: black;
    border-radius: 40px;
    text-decoration: none;
    font-weight: bold;
    display: inline-block;
  }

  /* CONTACT SECTION */
  .contact {
    padding: 60px 20px;
    background: #f5f5f5;
    text-align: center;
  }

  .contact h2 {
    margin-bottom: 10px;
  }

  form {
    max-width: 420px;
    margin: 20px auto 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  input, select, textarea {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
  }

  button {
    padding: 14px;
    background: black;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
</style>
</head>

<body>

<section class="hero">

  <!-- Logo -->
  <img src="logo-with-tag.png" class="logo" alt="Edju Cat Logo">

  <!-- Main content -->
  <div class="content">
    <a href="#contact" class="cta">Get Early Access</a>
  </div>

</section>

<section id="contact" class="contact">
  <h2>Get in Touch</h2>

  <form>
    <input type="text" placeholder="Name" required>
    <input type="email" placeholder="Email" required>

    <select>
      <option>I'm a Parent</option>
      <option>I'm a Teacher</option>
      <option>Investor</option>
      <option>Other</option>
    </select>

    <textarea placeholder="Message (optional)"></textarea>

    <button type="submit">Send</button>
  </form>
</section>

</body>
</html>
