<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edju Cat</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, Arial, sans-serif;
  }

  html, body {
    min-height: 100%;
  }

  body {
    background: #001827;
  }

  .page {
    min-height: 145vh;
    background: url("background.jpg") top center / cover no-repeat;
    position: relative;
  }

  .logo {
    position: absolute;
    top: 6vh;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(190px, 24vw, 360px);
    z-index: 2;
  }

  .contact-wrap {
    position: absolute;
    left: 50%;
    bottom: 8vh;
    transform: translateX(-50%);
    width: min(92%, 760px);
    z-index: 3;
  }

  .contact-card {
    background: rgba(2, 18, 32, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 26px;
    padding: 28px;
    color: white;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
  }

  .contact-card h2 {
    font-size: clamp(26px, 4vw, 40px);
    line-height: 1.05;
    margin-bottom: 10px;
    text-align: center;
  }

  .contact-card p {
    max-width: 620px;
    margin: 0 auto 22px;
    text-align: center;
    font-size: 15px;
    line-height: 1.5;
    opacity: 0.9;
  }

  form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  input, select, textarea {
    width: 100%;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.9);
    color: #07121f;
    border-radius: 14px;
    padding: 14px 15px;
    font-size: 15px;
    outline: none;
  }

  textarea {
    grid-column: 1 / -1;
    min-height: 90px;
    resize: vertical;
  }

  .full {
    grid-column: 1 / -1;
  }

  button {
    justify-self: center;
    grid-column: 1 / -1;
    margin-top: 4px;
    padding: 14px 34px;
    background: #22d3ee;
    color: #001827;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.3px;
    box-shadow: 0 10px 30px rgba(34, 211, 238, 0.35);
  }

  button:hover {
    transform: translateY(-1px);
  }

  @media (max-width: 700px) {
    .page {
      min-height: 150vh;
      background-position: top center;
    }

    .logo {
      top: 5vh;
      width: clamp(190px, 55vw, 300px);
    }

    .contact-wrap {
      bottom: 5vh;
    }

    .contact-card {
      padding: 22px;
      border-radius: 22px;
    }

    form {
      grid-template-columns: 1fr;
    }

    textarea,
    .full,
    button {
      grid-column: auto;
    }
  }
</style>
</head>

<body>

<main class="page">

  <img src="logo-with-tag.png" class="logo" alt="Edju Cat">

  <section class="contact-wrap">
    <div class="contact-card">
      <h2>Help Shape Edju Cat</h2>
      <p>
        We’re speaking with parents, teachers, investors and creative talent as we build our first adventure-led learning experiences.
      </p>

      <form>
        <input type="text" placeholder="Name" required>
        <input type="email" placeholder="Email" required>

        <select class="full" required>
          <option value="">I’m interested as...</option>
          <option>Parent</option>
          <option>Teacher / School</option>
          <option>Investor</option>
          <option>Creative / Developer / Educator</option>
          <option>Partnership</option>
          <option>Other</option>
        </select>

        <textarea placeholder="Short message (optional)"></textarea>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </section>

</main>

</body>
</html>
