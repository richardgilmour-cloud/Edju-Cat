<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Edju Cat</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #001827;
      font-family: system-ui, -apple-system, Arial, sans-serif;
      overflow-x: hidden;
    }

    .page {
      min-height: 150vh;
      background: url("background.jpg") center top / cover no-repeat;
      position: relative;
    }

    /* ====================================
       HERO AREA
    ==================================== */

    .hero-logo {
      position: absolute;
      top: 3vh;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      z-index: 5;
    }

    .logo-mark {
      display: block;
      width: min(44vw, 390px);
      height: auto;
      max-height: 22vh;
      margin: 0 auto;
      object-fit: contain;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.25));
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      min-width: 420px;
      padding: 12px 24px;
      background: #45e7e3;
      border-radius: 999px;
      color: #001e70;
      font-family: "Poppins", sans-serif;
      font-weight: 700;
      font-size: clamp(13px, 1.25vw, 18px);
      letter-spacing: 0.05em;
      line-height: 1;
      text-align: center;
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    /* ====================================
       CONTACT CARD
    ==================================== */

    .contact-wrap {
      position: absolute;
      left: 50%;
      bottom: 5vh;
      transform: translateX(-50%);
      width: min(92%, 700px);
    }

    .contact-card {
      background: rgba(2, 18, 32, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 22px 22px 20px;
      color: white;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    .contact-card h2 {
      font-family: "Poppins", sans-serif;
      font-weight: 700;
      font-size: clamp(24px, 3.5vw, 34px);
      margin-bottom: 8px;
      text-align: center;
    }

    .contact-card p {
      max-width: 580px;
      margin: 0 auto 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.45;
      opacity: 0.92;
    }

    /* ====================================
       FORM
    ==================================== */

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input,
    select,
    textarea {
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.92);
      color: #07121f;
      width: 100%;
      font-family: inherit;
    }

    textarea {
      grid-column: 1 / -1;
      min-height: 80px;
      resize: vertical;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      grid-column: 1 / -1;
      justify-self: center;
      margin-top: 4px;
      padding: 12px 28px;
      background: #45e7e3;
      color: #001e70;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-family: "Poppins", sans-serif;
      font-weight: 700;
      font-size: 14px;
      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    /* ====================================
       SUCCESS POP-UP
    ==================================== */

    .success-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 10, 22, 0.78);
      backdrop-filter: blur(10px);
    }

    .success-overlay.is-visible {
      display: flex;
    }

    .success-dialog {
      position: relative;
      width: min(92vw, 480px);
      padding: 34px 30px 30px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 26px;
      background: rgba(2, 24, 42, 0.96);
      color: white;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      animation: successAppear 0.3s ease-out;
    }

    .success-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #45e7e3;
      color: #001e70;
      font-family: "Poppins", sans-serif;
      font-size: 38px;
      font-weight: 700;
    }

    .success-dialog h2 {
      margin-bottom: 10px;
      font-family: "Poppins", sans-serif;
      font-size: clamp(25px, 5vw, 34px);
      font-weight: 700;
    }

    .success-dialog p {
      max-width: 380px;
      margin: 0 auto 22px;
      font-size: 15px;
      line-height: 1.55;
      opacity: 0.9;
    }

    .success-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 12px 28px;
      border: none;
      border-radius: 999px;
      background: #45e7e3;
      color: #001e70;
      font-family: "Poppins", sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .success-close:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    @keyframes successAppear {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ====================================
       MOBILE
    ==================================== */

    @media (max-width: 700px) {
      .page {
        min-height: 160vh;
      }

      .hero-logo {
        top: 2vh;
      }

      .logo-mark {
        width: 64vw;
        max-height: 18vh;
      }

      .tag-pill {
        min-width: unset;
        width: auto;
        padding: 10px 16px;
        font-size: clamp(12px, 3.8vw, 16px);
        letter-spacing: 0.03em;
      }

      .contact-wrap {
        bottom: 4vh;
      }

      form {
        grid-template-columns: 1fr;
      }

      textarea,
      .full,
      button {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="hero-logo">

      <img
        src="edju-cat-type-logo-svg.svg"
        class="logo-mark"
        alt="Edju Cat"
      >

      <div class="tag-pill">
        WHAT WILL YOU LEARN TODAY?
      </div>

    </div>

    <section class="contact-wrap">

      <div class="contact-card">

        <h2>Help Shape Edju Cat</h2>

        <p>
          We’re building a new kind of learning platform powered by a library
          of immersive, story-driven adventures.
        </p>

        <form
          action="https://formsubmit.co/steven@edjucat.com"
          method="POST"
        >

          <input
            type="hidden"
            name="_captcha"
            value="false"
          >

          <input
            type="hidden"
            name="_subject"
            value="New Edju Cat Enquiry"
          >

          <input
            type="hidden"
            name="_next"
            value="https://www.edjucat.com/?sent=true"
          >

          <input
            type="hidden"
            name="_template"
            value="table"
          >

          <input
            type="text"
            name="name"
            placeholder="Name"
            required
          >

          <input
            type="email"
            name="email"
            placeholder="Email"
            required
          >

          <select
            class="full"
            name="interest"
            required
          >
            <option value="">I’m interested as...</option>
            <option value="Investor">Investor</option>
            <option value="Parent">Parent</option>
            <option value="Teacher / School">Teacher / School</option>
            <option value="Developer / Content Creator">
              Developer / Content Creator
            </option>
            <option value="Partnership">Partnership</option>
            <option value="Other">Other</option>
          </select>

          <textarea
            name="message"
            placeholder="Short message"
            required
          ></textarea>

          <button type="submit">
            Send Message
          </button>

        </form>

      </div>

    </section>

  </main>

  <div
    id="success-overlay"
    class="success-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="success-title"
    aria-describedby="success-message"
  >
    <div class="success-dialog">

      <div class="success-icon" aria-hidden="true">
        ✓
      </div>

      <h2 id="success-title">
        Message Sent
      </h2>

      <p id="success-message">
        Thank you for getting in touch. We’ve received your message and someone
        from the Edju Cat team will get back to you soon.
      </p>

      <button
        id="success-close"
        class="success-close"
        type="button"
      >
        Continue Exploring
      </button>

    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const successOverlay = document.getElementById("success-overlay");
    const successClose = document.getElementById("success-close");

    function closeSuccessMessage() {
      successOverlay.classList.remove("is-visible");

      const cleanUrl =
        window.location.pathname +
        window.location.hash;

      window.history.replaceState({}, document.title, cleanUrl);
    }

    if (params.get("sent") === "true") {
      successOverlay.classList.add("is-visible");
      successClose.focus();
    }

    successClose.addEventListener("click", closeSuccessMessage);

    successOverlay.addEventListener("click", function (event) {
      if (event.target === successOverlay) {
        closeSuccessMessage();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (
        event.key === "Escape" &&
        successOverlay.classList.contains("is-visible")
      ) {
        closeSuccessMessage();
      }
    });
  </script>

</body>
</html>
