<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edju Cat</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, Arial;
  }

  html, body {
    height: 100%;
  }

  /* HERO */
  .hero {
    height: 100vh;
    background: url("background.jpg") center/cover no-repeat;
    position: relative;
  }

  .logo {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(160px, 20vw, 260px);
  }

  /* CONTACT SECTION (SEAMLESS) */
  .contact {
    background: url("contact-background.jpg") center/cover no-repeat;
    padding: 40px 20px 60px;
    text-align: center;
    color: white;
  }

  .contact-inner {
    max-width: 800px;
    margin: auto;
  }

  .contact h2 {
    font-size: 28px;
    margin-bottom: 10px;
  }

  .contact p {
    font-size: 16px;
    opacity: 0.9;
    margin-bottom: 20px;
  }

  form {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  input, select {
    flex: 1 1 180px;
    padding: 12px;
    border-radius: 6px;
    border: none;
  }

  textarea {
    width: 100%;
    padding: 12px;
    border-radius: 6px;
    border: none;
  }

  button {
    margin-top: 10px;
    padding: 14px 30px;
    background: #22d3ee;
    color: black;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
  }

  @media (max-width: 600px) {
    form {
      flex-direction: column;
    }
  }
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <img src="logo-with-tag.png" class="logo" alt="Edju Cat Logo">
</section>

<!-- CONTACT -->
<section class="contact">

  <div class="contact-inner">
    <h2>Help Shape Edju Cat</h2>
    <p>Parents, teachers, investors and creative talent — we’d love to hear from you.</p>

    <form>
      <input type="text" placeholder="Name" required>
      <input type="email" placeholder="Email" required>

      <select>
        <option>I’m a Parent</option>
        <option>I’m a Teacher</option>
        <option>Investor</option>
        <option>Creative / Developer</option>
        <option>Other</option>
      </select>

      <textarea placeholder="Message (optional)"></textarea>

      <button type="submit">Send</button>
    </form>
  </div>

</section>

</body>
</html>
