name: Build Studios DLC

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Studios release ID
        required: true
        type: string

concurrency:
  group: studios-dlc-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  package:
    name: Package and verify DLC
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/studios-dlc-packager
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PACKAGER_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_PACKAGER_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_PACKAGER_SECRET_ACCESS_KEY }}
      STUDIOS_BUCKET: edju-cat-studios-assets
      DLC_BUCKET: edjucat-modules
    steps:
      - name: Check out packager
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/studios-dlc-packager/package-lock.json

      - name: Install packager
        run: npm ci

      - name: Build, verify and upload DLC
        run: node package-release.mjs
